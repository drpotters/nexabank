apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexabank

resources:
  - ../../base

labels:
  - includeSelectors: true
    pairs:
      environment: prod

patches:
  - target:
      kind: Deployment
      name: nexabank
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: nexabank
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10

images:
  - name: ghcr.io/drpotters/nexabank
    newTag: latest
