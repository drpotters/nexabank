apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexabank

resources:
  - ../../base

# Sets HOST_PROVIDER=aws so /origin-info reports host_provider="aws".
components:
  - ../../components/provider-aws

labels:
  - includeSelectors: true
    pairs:
      environment: eks

patches:
  - target:
      kind: Deployment
      name: nexabank
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: nexabank
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6

images:
  - name: ghcr.io/drpotters/nexabank
    newTag: latest