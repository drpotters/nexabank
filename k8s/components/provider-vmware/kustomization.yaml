apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Marks the workload as running on VMware (Tanzu / vSphere). Surfaced as the
# `host_provider` field of /origin-info. Combine with an env overlay, e.g.:
#
#   components:
#     - ../../components/provider-vmware
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nexabank
        namespace: nexabank
      spec:
        template:
          spec:
            containers:
              - name: nexabank
                env:
                  - name: HOST_PROVIDER
                    value: vmware