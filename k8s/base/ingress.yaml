apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexabank
  namespace: nexabank
  labels:
    app.kubernetes.io/name: nexabank
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: nexabank.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexabank
                # The Service listens on port 80 and forwards to the container's 8080 port.
                port:
                  number: 80
